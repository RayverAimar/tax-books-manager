name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.0.0)'
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.settings.platform }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        settings:
          - platform: macos-latest
            args: '--target universal-apple-darwin'
            rust_targets: 'aarch64-apple-darwin x86_64-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
            rust_targets: ''
          - platform: windows-latest
            args: ''
            rust_targets: ''

    runs-on: ${{ matrix.settings.platform }}
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # historia completa necesaria para `git log $PREVIOUS_TAG..HEAD`

      - name: Generate changelog from commits
        id: changelog
        shell: bash
        run: |
          # Tag anterior al actual (excluyendo HEAD para evitar match con sí mismo)
          PREVIOUS_TAG=$(git tag --sort=-v:refname --merged HEAD | grep -v "^${GITHUB_REF_NAME}$" | head -1 || echo "")
          if [ -n "$PREVIOUS_TAG" ]; then
            LOG=$(git log "$PREVIOUS_TAG..HEAD" --pretty=format:"- %s" --no-merges)
            RANGE_HEADER="Cambios desde \`$PREVIOUS_TAG\`"
          else
            LOG=$(git log --pretty=format:"- %s" --no-merges | head -20)
            RANGE_HEADER="Cambios recientes"
          fi
          {
            echo "log<<EOF"
            echo "$LOG"
            echo "EOF"
            echo "range_header=$RANGE_HEADER"
          } >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.rust_targets }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux dependencies
        if: matrix.settings.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Auto-update signing. Las keys se generan una vez con
          # `npx @tauri-apps/cli signer generate -w ~/.tauri/registro-libros.key`
          # y se guardan como secrets en GitHub: Settings → Secrets → Actions.
          # tauri-action firma cada binario y genera latest.json automáticamente.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Registro de Libros Electrónicos ${{ github.ref_name }}'
          # El body se mostrará tanto en la página del release como en el dialog
          # de auto-update dentro de la app. Por eso lo mantenemos minimal:
          # solo los commits desde el tag anterior. GitHub auto-lista los binarios
          # como Assets debajo del body, no hace falta repetir instrucciones de install.
          releaseBody: |
            ### ${{ steps.changelog.outputs.range_header }}

            ${{ steps.changelog.outputs.log }}
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: ${{ matrix.settings.args }}
